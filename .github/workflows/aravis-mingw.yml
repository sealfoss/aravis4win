# MSYS2 setup with actions is described here:
# https://github.com/marketplace/actions/setup-msys2

name: Aravis-MinGW

on:
  push:
    branches: [ main, aravis-0-8 ]
  pull_request:
    branches: [ main, aravis-0-8 ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mingw:
    runs-on: windows-2025
    strategy:
      fail-fast: false # see all failures, not just the first one
      matrix:
        include:
          # MSYS2's libusb (1.0.30, without hotplug support)
          - { sys: mingw64, env: x86_64, buildtype: plain }
          # - { sys: mingw32, env: i686 } # mingw32 is missing gst-plugins-good package, disabled for now
          # libusb 1.0.30 from subprojects/libusb.wrap with Windows hotplug support, packaged as a zip
          - { sys: ucrt64,  env: ucrt-x86_64, buildtype: release, package: true,
              meson-args: '--force-fallback-for=libusb-1.0 -Dlibusb:windows-hotplug=true' }
          # - { sys: clang64, env: clang-x86_64 } # clang64 is missing several packages, disabled for now
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        release: true
        path-type: minimal
        update: false
        install: >-
          mingw-w64-${{matrix.env}}-toolchain
          mingw-w64-${{matrix.env}}-gcc
          mingw-w64-${{matrix.env}}-gobject-introspection
          mingw-w64-${{matrix.env}}-meson
          mingw-w64-${{matrix.env}}-gst-plugins-good
          mingw-w64-${{matrix.env}}-gst-plugins-bad
          mingw-w64-${{matrix.env}}-gstreamer
          mingw-w64-${{matrix.env}}-gtk3
          mingw-w64-${{matrix.env}}-libxml2
          mingw-w64-${{matrix.env}}-zlib
          mingw-w64-${{matrix.env}}-libusb
          mingw-w64-${{matrix.env}}-gobject-introspection-runtime
          mingw-w64-${{matrix.env}}-python-gobject
    - uses: actions/checkout@v5
    - name: meson
      run: |
        mkdir build
        meson setup --buildtype=${{matrix.buildtype}} -Ddocumentation=disabled -Dgst-plugin=enabled -Dintrospection=enabled -Dusb=enabled -Dviewer=enabled -Dgentl-producer=true ${{matrix.meson-args}} . ./build
    - name: ninja
      run: |
        ninja -C ./build --verbose
    - name: package
      if: matrix.package
      run: |
        set -e
        meson install -C ./build --no-rebuild --destdir "$(cygpath -m "$PWD/stage")"
        python .github/scripts/package-windows.py --builddir build --destdir stage \
          --flavour msys2-${{matrix.sys}} --revision "$GITHUB_SHA" ${{ github.event_name == 'release' && '--release' || '' }} \
          --output-dir dist
    - name: smoke test
      if: matrix.package
      run: |
        # The unzipped package, before Aravis is installed into the MSYS2 prefix
        set -e
        python -c "import glob, sys, zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall(sys.argv[1])" unzipped
        python .github/scripts/smoke-test-gstreamer.py --prefix "$(ls -d unzipped/aravis-*)"
    - name: test configuration
      # The tests run with -Dgv-n-buffers=1, as in every Windows CI job since
      # commit b4211e5e, once the zip, built with the default, is made
      run: |
        meson configure ./build -Dgv-n-buffers=1
    - name: ninja install
      run: |
        ninja -C ./build --verbose install
    - name: meson test
      env:
        # tests/libusbversion.c: every Windows job links libusb 1.0.30 or later
        ARV_TEST_LIBUSB_MIN_VERSION: 1.0.30
        ARV_TEST_LIBUSB_HOTPLUG: ${{ matrix.package && '1' || '' }}
      run: |
        meson test -C ./build
    - uses: actions/upload-artifact@v6
      if: matrix.package
      with:
        name: aravis-msys2-${{matrix.sys}}
        path: dist/*
        if-no-files-found: error
    - uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: ${{matrix.sys}}_Meson_Testlog
        path: build/meson-logs/testlog.txt

  release-assets:
    if: github.event_name == 'release'
    needs: mingw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: aravis-msys2-*
        merge-multiple: true
        path: dist
    - name: attach to release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
