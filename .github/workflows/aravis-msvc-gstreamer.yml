# MSVC build against the official GStreamer development package for Windows,
# which provides GLib, libxml2 and zlib. libusb is built from
# subprojects/libusb.wrap, with Windows hotplug support. The job builds the
# GStreamer plugin, packages a zip that is smoke-tested against a fake GigE
# Vision camera, uploaded as an artifact and attached to published releases,
# runs the tests and checks the libusb version floor of meson.build.
#
# As in the other Windows CI jobs, the tests run with -Dgv-n-buffers=1 (commit
# b4211e5e), but the zip is built with the default of the option first.

name: Aravis-MSVC-GStreamer

on:
  push:
    branches: [ main, aravis-0-8 ]
  pull_request:
    branches: [ main, aravis-0-8 ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GSTREAMER_VERSION: 1.28.7
  GSTREAMER_SHA256: 032fc6062b8539838fc8da22589cb9b24c5d820baa7f8cc160af9ea08395badf
  # The .pc files of the package compute their prefix from their location, and
  # pkg-config escapes spaces: install outside "Program Files".
  GSTREAMER_ROOT: C:\gstreamer\1.0\msvc_x86_64

jobs:
  msvc-gstreamer:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
    - name: checkout
      uses: actions/checkout@v5

    - name: python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: pip
      run: pip install meson ninja

    - name: cache GStreamer installer
      id: gstreamer-cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}\gstreamer-installer
        key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}-${{ env.GSTREAMER_SHA256 }}

    - name: download GStreamer
      if: steps.gstreamer-cache.outputs.cache-hit != 'true'
      run: |
        New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\gstreamer-installer" | Out-Null
        $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
        curl.exe --fail --location --retry 3 --silent --show-error --output "$env:RUNNER_TEMP\gstreamer-installer\gstreamer.exe" $url
        if ($LASTEXITCODE -ne 0) { throw "Download of $url failed" }

    - name: install GStreamer
      run: |
        $installer = "$env:RUNNER_TEMP\gstreamer-installer\gstreamer.exe"
        $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
        if ($hash -ne $env:GSTREAMER_SHA256) { throw "GStreamer installer checksum mismatch: $hash" }
        # Inno Setup installer: runtime and development files, no VC++ redistributable (the image has it)
        $log = "$env:RUNNER_TEMP\gstreamer-install.log"
        $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', '/TYPE=devel',
                       '/MERGETASKS=!install_vcredist', "/DIR=$env:GSTREAMER_ROOT", "/LOG=$log")
        $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
        if ($process.ExitCode -ne 0 -or -not (Test-Path "$env:GSTREAMER_ROOT\lib\pkgconfig\gstreamer-1.0.pc")) {
          if (Test-Path $log) { Get-Content $log -Tail 50 }
          throw "GStreamer installation failed (exit code $($process.ExitCode))"
        }
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$env:GSTREAMER_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: native file
      run: |
        # Runs glib-mkenums and glib-genmarshal with this Python: the scripts of
        # the package start with the packager's interpreter path.
        python .github/scripts/gstreamer-native-file.py $env:GSTREAMER_ROOT "$env:RUNNER_TEMP\gstreamer-msvc.ini"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Get-Content "$env:RUNNER_TEMP\gstreamer-msvc.ini"
        gst-inspect-1.0 --version

    - name: configure
      # Quoted: PowerShell splits unquoted native arguments such as -Dfoo.bar=baz at the dot
      run: >-
        meson setup build --vsenv --native-file "$env:RUNNER_TEMP\gstreamer-msvc.ini"
        --buildtype=release "-Dpkgconfig.relocatable=true"
        -Dgst-plugin=enabled -Dusb=enabled -Dviewer=disabled -Dintrospection=disabled -Ddocumentation=disabled
        "-Dlibusb:windows-hotplug=true"

    - name: compile
      run: meson compile -C build

    - name: package
      run: |
        meson install -C build --no-rebuild --destdir "$env:RUNNER_TEMP\stage"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python .github/scripts/package-windows.py --builddir build --destdir "$env:RUNNER_TEMP\stage" `
          --flavour msvc-x86_64 --revision $env:GITHUB_SHA ${{ github.event_name == 'release' && '--release' || '' }} `
          --output-dir dist

    - name: smoke test
      run: |
        # The unzipped package, against the GStreamer installation only
        $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
        Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\unzipped"
        python .github/scripts/smoke-test-gstreamer.py --prefix "$env:RUNNER_TEMP\unzipped\$($zip.BaseName)"

    - name: test configuration
      # Once the zip is made: meson test rebuilds the GigE Vision stream code
      run: meson configure build -Dgv-n-buffers=1

    - name: test
      env:
        # tests/libusbversion.c: the bundled libusb is 1.0.30 or later, with hotplug support
        ARV_TEST_LIBUSB_MIN_VERSION: 1.0.30
        ARV_TEST_LIBUSB_HOTPLUG: 1
      run: meson test -C build --no-suite libusb --print-errorlogs

    - name: libusb version floor
      run: python .github/scripts/check-libusb-floor.py -- --vsenv --native-file "$env:RUNNER_TEMP\gstreamer-msvc.ini"

    - name: upload package
      uses: actions/upload-artifact@v6
      with:
        name: aravis-msvc-x86_64
        path: dist/*
        if-no-files-found: error

    - name: logs
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: msvc-gstreamer_Meson_Logs
        path: |
          build/meson-logs/testlog.txt
          build/meson-logs/meson-log.txt
        if-no-files-found: ignore

  release-assets:
    if: github.event_name == 'release'
    needs: msvc-gstreamer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: aravis-msvc-x86_64
        path: dist
    - name: attach to release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
